services:
  locust:
    image: locustio/locust:2.37.9
    command: ["-f", "/mnt/locustfile.py", "--web-host", "0.0.0.0", "--web-port", "8089"]
    environment:
      FILE_NAMES: tiny.txt
      WAIT_SECONDS: "1"
    ports:
      - "127.0.0.1:8089:8089"
    volumes:
      - ../locustfile.py:/mnt/locustfile.py:ro
  locust-exporter:
    image: locustio/locust:2.37.9
    entrypoint: ["python", "/opt/exporter/locust_exporter.py"]
    environment:
      LOCUST_STATS_URL: http://locust:8089/stats/requests
    volumes:
      - ./locust_exporter.py:/opt/exporter/locust_exporter.py:ro
    depends_on:
      - locust
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - locust-exporter
  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/locust.json:/var/lib/grafana/dashboards/locust.json:ro
    depends_on:
      - prometheus
volumes:
  prometheus-data:
